<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BookShop — Оформление заказа</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="index.html">BookShop</a>
    <nav>
      <a href="index.html">Главная</a>
      <a href="catalog.html">Каталог</a>
      <a href="cart.html">Корзина</a>
    </nav>
  </div>
</header>
<main><div class="container">
  <h1>Оформление заказа</h1>
  <form class="panel">
    <label for="name">Ваше имя</label><input id="name" name="name" required placeholder="Введите имя">
    <label for="email">Электронная почта</label><input id="email" name="email" type="email" required placeholder="name@example.com">
    <label for="address">Адрес доставки</label><input id="address" name="address" required placeholder="Улица, дом">
    <p style="margin-top:20px"><button class="btn" type="button" onclick="alert('Демо-страница: заказ не отправляется на сервер.')">Подтвердить заказ</button></p>
  </form>
</div></main>
<footer>BookShop — книжный магазин · Практика по CSS</footer>
</body></html>
